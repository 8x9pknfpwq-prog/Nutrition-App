# Render Blueprint — one-click full-stack hosting for NYC Lines.
# Deploys the Node/Express + Socket.io server (which also serves the built React
# client) plus a managed PostgreSQL database. See lineup/README.md → "Hosting".
#
# After importing this blueprint in Render, set this secret env var in the
# dashboard (marked sync:false below):
#   - VITE_MAPBOX_TOKEN     your Mapbox PUBLIC token (pk.*)   [build-time]

databases:
  - name: nyc-lines-db
    databaseName: lineup
    user: lineup
    plan: free

services:
  - type: web
    name: nyc-lines
    runtime: node
    plan: free
    rootDir: lineup
    # Build the client + sync the DB schema and seed it once (seed is idempotent).
    buildCommand: npm install && npx prisma generate && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nyc-lines-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: VITE_MAPBOX_TOKEN
        sync: false # set in dashboard — Mapbox public token (pk.*)
