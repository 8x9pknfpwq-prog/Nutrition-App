name: Deploy demo (GitHub Pages)

# Builds the static "demo mode" of the NYC Lines app (lineup/) and deploys it
# via GitHub's official Pages mechanism (artifact upload — NOT a git push), so
# it isn't subject to branch push-protection.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/loving-cerf-qdgs70
      - main
    paths:
      - 'lineup/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lineup/package-lock.json

      - name: Install dependencies
        working-directory: lineup
        run: npm ci

      - name: Validate Mapbox token
        env:
          TOK: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "VITE_MAPBOX_TOKEN is empty — building with the schematic fallback map."
            exit 0
          fi
          echo "Token length: ${#TOK} characters (a single Mapbox token is ~90)."
          case "$TOK" in
            *sk.eyJ*)
              echo "::error::VITE_MAPBOX_TOKEN contains a Mapbox SECRET token (an 'sk.' token). The secret must contain ONLY your PUBLIC token (a single string starting with 'pk.'). A secret token must never ship in a public site."
              exit 1 ;;
          esac
          case "$TOK" in
            pk.*) : ;;
            *) echo "::error::VITE_MAPBOX_TOKEN does not start with 'pk.'. Use a Mapbox public token."; exit 1 ;;
          esac
          case "$TOK" in
            *[[:space:]]*)
              echo "::error::VITE_MAPBOX_TOKEN contains whitespace or multiple lines. Paste ONLY the single public token string."
              exit 1 ;;
          esac
          echo "VITE_MAPBOX_TOKEN looks like a clean public token (pk.)."

      - name: Build static demo
        working-directory: lineup
        env:
          # If the Supabase vars are set (repo Variables), the app runs against
          # Supabase; otherwise it falls back to the in-browser demo.
          VITE_DEMO: 'true'
          # A custom domain serves the site at the root ("/"); the github.io
          # subpath serves it at "/<repo>/". Set repo Variable
          # VITE_CUSTOM_DOMAIN (e.g. nyclines.app) to switch to root.
          VITE_BASE: ${{ vars.VITE_CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          # Public Mapbox token (pk.*). Enables the live interactive map.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          # Optional privacy-friendly analytics. Set repo Variable
          # VITE_PLAUSIBLE_DOMAIN to your site's domain to turn it on.
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
        run: npm run build

      # Custom domain: tell GitHub Pages the domain (CNAME) and make the social
      # card URLs absolute so link previews work off-platform (e.g. Facebook).
      - name: Configure custom domain
        if: vars.VITE_CUSTOM_DOMAIN != ''
        working-directory: lineup
        env:
          DOMAIN: ${{ vars.VITE_CUSTOM_DOMAIN }}
        run: |
          echo "$DOMAIN" > dist/CNAME
          sed -i "s#content=\"/og.png\"#content=\"https://$DOMAIN/og.png\"#g" dist/index.html
          sed -i "s#content=\"/\" />#content=\"https://$DOMAIN/\" />#g" dist/index.html
          echo "Custom domain set to $DOMAIN"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lineup/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
