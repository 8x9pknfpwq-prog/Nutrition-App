name: Deploy demo (GitHub Pages)

# Builds the static "demo mode" of the NYC Lines app (lineup/) and publishes it
# to the gh-pages branch. Enable Pages once under:
#   Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages / (root)

on:
  push:
    branches:
      - claude/loving-cerf-qdgs70
      - main
    paths:
      - 'lineup/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lineup/package-lock.json

      - name: Install dependencies
        working-directory: lineup
        run: npm ci

      - name: Validate Mapbox token type
        env:
          TOK: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "VITE_MAPBOX_TOKEN is not set — building with the schematic fallback map."
          elif [ "${TOK#pk.}" != "$TOK" ]; then
            echo "VITE_MAPBOX_TOKEN is a public token (pk.) — good."
          elif [ "${TOK#sk.}" != "$TOK" ]; then
            echo "::error::VITE_MAPBOX_TOKEN is a Mapbox SECRET token (starts with sk.). It cannot ship in a public site and is blocked by GitHub push protection. Replace it with a PUBLIC token (pk.) under Settings → Secrets and variables → Actions."
            exit 1
          else
            echo "::error::VITE_MAPBOX_TOKEN does not start with 'pk.' — expected a public Mapbox token."
            exit 1
          fi

      - name: Build static demo
        working-directory: lineup
        env:
          VITE_DEMO: 'true'
          # Serves correctly from the repo subpath, e.g. /Nutrition-App/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Enables the live interactive map. MUST be a Mapbox *public* token
          # (starts with "pk.") since it ships in the client bundle — a secret
          # token ("sk.") is blocked by GitHub push protection. Add it under
          # Settings → Secrets and variables → Actions as repository secret
          # VITE_MAPBOX_TOKEN. If unset, the app uses the schematic map.
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: lineup/dist
          force_orphan: true
